name: Build MoxMixed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ARCHIVE=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)
          test -n "$ARCHIVE" || { echo "ZIP not found"; exit 1; }
          mkdir source
          unzip -q "$ARCHIVE" -d source
          PROJECT_FILE=$(find source -name settings.gradle.kts -print -quit)
          test -n "$PROJECT_FILE" || { echo "Gradle project not found"; exit 1; }
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-37"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew :composeApp:assembleRemoteDebug \
            -PposterRemoteScheme=https \
            -PposterRemoteHost=moxmixed.example \
            -PposterRemotePort=443 \
            --no-daemon

      - name: Find APK
        run: |
          find "$PROJECT_DIR" -type f -name '*.apk' -print
          APK=$(find "$PROJECT_DIR" -type f -name '*.apk' -print -quit)
          test -n "$APK" || { echo "APK not found"; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoxMixed-APK
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
          if-no-files-found: error
          retention-days: 14
