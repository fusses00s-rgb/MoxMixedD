name: Build MoxMixed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ARCHIVE=$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)
          if [ -z "$ARCHIVE" ]; then
            echo "ZIP archive not found"
            exit 1
          fi

          mkdir source
          unzip -q "$ARCHIVE" -d source

          PROJECT_FILE=$(find source -name settings.gradle.kts -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            echo "Gradle project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build MoxMixed APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew

          ./gradlew :composeApp:assembleRemoteDebug \
            -PposterRemoteScheme=https \
            -PposterRemoteHost=moxmixed.example \
            -PposterRemotePort=443 \
            --no-daemon

      - name: Check APK
        run: |
          find "$PROJECT_DIR" -type f -name '*.apk' -print

          APK=$(find "$PROJECT_DIR" -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "APK was not created"
            exit 1
          fi

          sha256sum "$APK" > "$APK.sha256"
          echo "APK created successfully"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoxMixed-APK
          path: |
            source/**/*.apk
            source/**/*.apk.sha256
          if-no-files-found: error
          retention-days: 14
