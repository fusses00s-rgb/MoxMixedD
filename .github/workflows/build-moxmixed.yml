name: Build MoxMixed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ARCHIVE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          if [ -z "$ARCHIVE" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir source
          unzip -q "$ARCHIVE" -d source
          PROJECT_DIR=$(find source -name settings.gradle.kts -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew :composeApp:assembleRemoteDebug \
            -PposterRemoteScheme=https \
            -PposterRemoteHost=moxmixed.example \
            -PposterRemotePort=443 \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoxMixed-debug-apk
          path: source/**/build/outputs/apk/remote/debug/*.apk
          if-no-files-found: error
          retention-days: 14
